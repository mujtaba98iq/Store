<section class="hero" id="hero">
  <div class="hero__media">
    <img
      ngSrc="images/Home.jpg"
      fill
      priority
      alt="Smiling woman holding a bottle of STOR Moisture Repair Cream"
    />
  </div>
  <div class="hero__scrim" aria-hidden="true"></div>

  <div class="hero__inner">
    <h1 class="hero__title">Nurture Your Glow and Reveal Your Beauty</h1>

    <app-avatar-stack
      class="hero__social"
      [avatars]="avatars()"
      [count]="customerCount()"
      label="people glowing with STOR"
    />

    @if (featured(); as product) {
      <app-product-card
        class="hero__product"
        [name]="product.name"
        [price]="product.price ?? 0"
        [image]="imageFor(product)"
        [category]="product.categories[0]?.name ?? ''"
      />
    }

    <div class="hero__cta">
      <p class="hero__lede">
        Discover gentle formulas designed to support healthy, radiant skin every day and elevate
        your natural beauty with effective care.
      </p>
      <div class="hero__actions">
        <a class="btn btn--dark" routerLink="/products">Start Your Glow</a>
        <a class="btn btn--light" href="#concept">Read more</a>
      </div>
    </div>
  </div>
</section>
