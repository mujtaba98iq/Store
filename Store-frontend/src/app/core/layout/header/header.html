<header class="site-header">
  <a class="brand" routerLink="/" aria-label="STOR — home">STOR</a>

  <nav class="nav" aria-label="Primary">
    @for (item of navItems(); track item.label) {
      <a
        class="nav__link"
        [routerLink]="item.link"
        [fragment]="item.fragment"
        [routerLinkActive]="item.activeClass"
        [routerLinkActiveOptions]="exactMatch"
        >{{ item.label }}</a
      >
    }
  </nav>

  <div class="actions">
    <a class="icon-btn" href="#wishlist" aria-label="Wishlist">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
        <path
          d="M12 20.5 3.9 12.4a5 5 0 1 1 7.1-7.1l1 1 1-1a5 5 0 1 1 7.1 7.1z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>
    </a>
    <a class="icon-btn icon-btn--cart" routerLink="/cart" [attr.aria-label]="cartLabel()">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
        <path
          d="M4.5 7.5h15l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H7.2a1.5 1.5 0 0 1-1.5-1.3z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path
          d="M8.75 9.5V6.75a3.25 3.25 0 0 1 6.5 0V9.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      @if (cartCount() > 0) {
        <span class="icon-btn__badge" aria-hidden="true">{{ cartCount() }}</span>
      }
    </a>
    @if (isSignedIn()) {
      <button
        class="icon-btn"
        type="button"
        (click)="signOut()"
        [attr.aria-label]="'Sign out' + (email() ? ' of ' + email() : '')"
      >
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
          <path
            d="M14.5 8.5V6.75A1.75 1.75 0 0 0 12.75 5h-6A1.75 1.75 0 0 0 5 6.75v10.5A1.75 1.75 0 0 0 6.75 19h6a1.75 1.75 0 0 0 1.75-1.75V15.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <path
            d="M11 12h8m0 0-2.5-2.5M19 12l-2.5 2.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    } @else {
      <a class="icon-btn" routerLink="/login" aria-label="Sign in">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
          <circle cx="12" cy="8.25" r="3.75" stroke="currentColor" stroke-width="1.5" />
          <path
            d="M4.5 20.25a7.5 7.5 0 0 1 15 0"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </a>
    }
  </div>
</header>
